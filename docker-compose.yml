version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: uniclear-postgres
    restart: always
    environment:
      POSTGRES_USER: uniclear
      POSTGRES_PASSWORD: uniclear_password_2026
      POSTGRES_DB: uniclear
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U uniclear -d uniclear"]
      interval: 5s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer:latest
    container_name: uniclear-adminer
    restart: always
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: uniclear-pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@uniclear.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "5050:80"
    volumes:
      - ./pgadmin_servers.json:/pgadmin4/servers.json:ro
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
    driver: local
